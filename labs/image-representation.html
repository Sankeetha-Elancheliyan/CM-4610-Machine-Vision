<title>Image Representation Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one wide column. Source picker, six-step tab row, then a stage of cards. Rose outline always marks the pixel you are pointing at. Red, green and blue always mean the R, G and B channels. */
:root{
  --bg:#F3F4F7;--surface:#FFFFFF;--ink:#111827;--muted:#566074;--line:#CFD5E0;
  --accent:#C2185B;--r:#C93B2B;--g:#23864A;--b:#2A58C8;--tone:var(--ink);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1319;--surface:#171C25;--ink:#E8ECF3;--muted:#9AA5B8;--line:#2B3340;
    --accent:#FF6FA5;--r:#FF7A6B;--g:#5FD38A;--b:#7FA6FF;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1319;--surface:#171C25;--ink:#E8ECF3;--muted:#9AA5B8;--line:#2B3340;
  --accent:#FF6FA5;--r:#FF7A6B;--g:#5FD38A;--b:#7FA6FF;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
main{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-0.015em;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,3.4vw,26px);line-height:1.2;margin:0 0 6px;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--muted);max-width:62ch}
.eyebrow,.cl,.ctl-label{font-family:var(--font-mono);font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer;min-height:38px}
button:hover{border-color:var(--ink)}
button:active{transform:scale(0.98)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed="true"],button.tog[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 11%,var(--surface));border-color:var(--ink);font-weight:500}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.primary:hover{filter:brightness(1.15)}
.steps{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:12px}
.steps button{display:flex;gap:8px;align-items:baseline}
.steps button b{font-family:var(--font-mono);font-weight:500;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps button[aria-current="step"] b{color:var(--bg)}
.panel[hidden]{display:none}
.explain{margin:0 0 16px;max-width:70ch;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px;margin-bottom:16px}
.card{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.card canvas{width:100%;height:auto;aspect-ratio:1;display:block;background:#000;border-radius:3px;image-rendering:pixelated}
.card canvas.pick{cursor:crosshair}
.card canvas.strip{aspect-ratio:auto;height:34px}
.cc{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
.cl{margin:0}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:700px){.split{grid-template-columns:minmax(0,1fr)}}
.card canvas.big{max-width:520px;cursor:crosshair;image-rendering:auto;aspect-ratio:1}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-bottom:12px}
.controls[hidden]{display:none}
.ctl{display:flex;align-items:center;gap:10px;font-size:14px}
.ctl input[type=range]{width:min(220px,46vw);accent-color:var(--ink)}
.ctl output{font-family:var(--font-mono);font-size:13px;min-width:3.4em;font-variant-numeric:tabular-nums}
.readout{margin:0 0 6px;font-size:15px;min-height:24px}
.readout b,.mono{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums}
.note{margin:6px 0 0;font-size:14px;color:var(--muted);max-width:70ch}
.mxwrap{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:2px}
table.mx input{width:clamp(32px,10vw,46px);height:36px;font:inherit;font-family:var(--font-mono);font-size:13px;text-align:center;border:1px solid var(--line);border-radius:3px;padding:0;-moz-appearance:textfield;appearance:textfield}
table.mx input::-webkit-outer-spin-button,table.mx input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
table.mx input.hl{outline:3px solid var(--accent);outline-offset:0;position:relative;z-index:1}
table.nb{border-collapse:separate;border-spacing:2px;font-family:var(--font-mono);font-size:12px}
table.nb td{min-width:34px;text-align:center;padding:3px 2px;border-radius:3px;background:color-mix(in srgb,var(--ink) 6%,var(--surface))}
table.nb td.mid{outline:2px solid var(--accent);font-weight:500}
.code{position:relative;margin:0 0 14px}
.code pre{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;font-family:var(--font-mono);font-size:13px;line-height:1.55}
.code button{position:absolute;top:8px;right:8px;min-height:30px;padding:3px 10px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-mono);font-size:12px;padding:4px 8px;border-radius:4px;border:1px solid var(--line);min-width:38px;text-align:center}
.swatch{width:100%;height:64px;border-radius:6px;border:1px solid var(--line)}
.rgbtag{font-family:var(--font-mono);font-weight:500}
.r{color:var(--r)}.g{color:var(--g)}.b{color:var(--b)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px}
.small{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion: reduce){button:active{transform:none}}
</style>

<main>
  <header>
    <p class="eyebrow" style="margin:0 0 8px">Machine vision · image representation</p>
    <h1>Image representation lab</h1>
    <p class="lede">See how a picture becomes a grid of numbers: pixels, the number matrix, gray levels and colour channels.</p>
  </header>

  <section class="row" aria-label="Choose an image">
    <span class="ctl-label">Image</span>
    <div class="seg" id="src">
      <button type="button" data-v="landscape" aria-pressed="true">Landscape</button>
      <button type="button" data-v="card" aria-pressed="false">Colour test card</button>
      <button type="button" data-v="upload" aria-pressed="false">Upload your own</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <span class="small" id="srcmsg">Stored as 128 × 128 pixels. Everything runs in your browser.</span>
  </section>

  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <div id="stage"></div>
  <div class="foot">
    <button type="button" id="back">Back</button>
    <button type="button" id="next" class="primary">Next</button>
  </div>
</main>

<script>
//CORE-START
const S=128,SS=S*S;
function grayFromRGBA(d){const g=new Uint8ClampedArray(SS);for(let i=0;i<SS;i++)g[i]=Math.round(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]);return g;}
function downsample(g,res){
  const f=S/res,out=new Uint8ClampedArray(res*res),n=f*f;
  for(let y=0;y<res;y++)for(let x=0;x<res;x++){let s=0;for(let j=0;j<f;j++)for(let i=0;i<f;i++)s+=g[(y*f+j)*S+x*f+i];out[y*res+x]=Math.round(s/n);}
  return out;
}
function quant(v,bits){const L=(1<<bits)-1;return Math.round(Math.round(v/255*L)*255/L);}
//CORE-END

const BIG=720;
const $=(s,r)=>(r||document).querySelector(s);
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function clampB(v){return v<0?0:v>255?255:v;}
function fmt(n){return n.toLocaleString('en-US');}
function seg(name,opts,cur){return `<div class="seg" data-name="${name}" role="group">${opts.map(o=>`<button type="button" data-v="${o[0]}" aria-pressed="${String(o[0])===String(cur)}">${o[1]}</button>`).join('')}</div>`;}
function bindSeg(root,name,cb){
  const g=root.querySelector(`.seg[data-name="${name}"]`);
  g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));cb(b.dataset.v);});
  return g;
}
function setSeg(g,v){g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===String(v))));}
function slider(id,label,min,max,val,step,suffix){
  return `<label class="ctl" for="${id}"><span>${label}</span><input type="range" id="${id}" min="${min}" max="${max}" value="${val}" step="${step||1}"><output id="${id}-o" for="${id}">${val}${suffix||''}</output></label>`;
}
function bindSlider(root,id,cb,suffix){
  const s=root.querySelector('#'+id),o=root.querySelector('#'+id+'-o');
  const show=v=>{o.textContent=v+(suffix||'');};
  s.addEventListener('input',()=>{show(+s.value);cb(+s.value);});
  return {set(v){s.value=v;show(+s.value);},get:()=>+s.value};
}
function makeCard(label,n,cap,extra){
  n=+n;
  const c=el(`<figure class="card"><figcaption class="cl">${label}</figcaption><canvas width="${n}" height="${n}" class="${extra||''}" role="img" aria-label="${label.replace(/<[^>]*>/g,'')}"></canvas><p class="cc">${cap||''}</p></figure>`);
  const cv=c.querySelector('canvas'),ctx=cv.getContext('2d');
  return {el:c,cv,ctx,img:ctx.createImageData(n,n),cap:c.querySelector('.cc'),lab:c.querySelector('.cl')};
}
function paintCard(card,fn){
  const d=card.img.data;
  for(let i=0;i<SS;i++){fn(i,d,i*4);d[i*4+3]=255;}
  card.ctx.putImageData(card.img,0,0);
}
function grayCard(card,arr){paintCard(card,(i,d,o)=>{d[o]=d[o+1]=d[o+2]=arr[i];});}
function cellAt(cv,e,n){
  const r=cv.getBoundingClientRect();
  let x=Math.floor((e.clientX-r.left)/r.width*n),y=Math.floor((e.clientY-r.top)/r.height*n);
  x=Math.max(0,Math.min(n-1,x));y=Math.max(0,Math.min(n-1,y));
  return {x,y};
}
function drawCells(cv,vals,res,o){
  const ctx=cv.getContext('2d');
  const off=document.createElement('canvas');off.width=off.height=res;
  const octx=off.getContext('2d'),id=octx.createImageData(res,res);
  for(let i=0;i<res*res;i++){const v=vals[i],k=i*4;id.data[k]=id.data[k+1]=id.data[k+2]=v;id.data[k+3]=255;}
  octx.putImageData(id,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,BIG,BIG);
  ctx.drawImage(off,0,0,BIG,BIG);
  const cs=BIG/res;
  if(o.grid&&res<=32){
    ctx.strokeStyle='rgba(140,150,170,0.7)';ctx.lineWidth=1;ctx.beginPath();
    for(let i=1;i<res;i++){ctx.moveTo(i*cs,0);ctx.lineTo(i*cs,BIG);ctx.moveTo(0,i*cs);ctx.lineTo(BIG,i*cs);}
    ctx.stroke();
  }
  if(o.numbers&&res<=16){
    ctx.font=(res<=8?22:15)+'px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    for(let y=0;y<res;y++)for(let x=0;x<res;x++){
      const v=vals[y*res+x];ctx.fillStyle=v>140?'#000':'#fff';
      ctx.fillText(String(v),x*cs+cs/2,y*cs+cs/2);
    }
  }
  if(o.hover!=null&&o.hover>=0){
    const hx=(o.hover%res)*cs,hy=Math.floor(o.hover/res)*cs;
    ctx.strokeStyle=css('--accent');ctx.lineWidth=5;ctx.strokeRect(hx+2.5,hy+2.5,cs-5,cs-5);
  }
}
function drawRamp(cv,fn){
  const ctx=cv.getContext('2d'),id=ctx.createImageData(256,1);
  for(let x=0;x<256;x++){const v=fn(x),k=x*4;id.data[k]=id.data[k+1]=id.data[k+2]=v;id.data[k+3]=255;}
  ctx.putImageData(id,0,0);
}
function codeBlock(getText){
  const w=el('<div class="code"><pre></pre><button type="button">Copy</button></div>');
  const pre=w.querySelector('pre'),btn=w.querySelector('button');
  function refresh(){pre.textContent=getText();}
  btn.addEventListener('click',async()=>{
    const t=pre.textContent;let done=false;
    try{await navigator.clipboard.writeText(t);done=true;btn.textContent='Copied';}catch(e){}
    if(!done){
      try{const r=document.createRange();r.selectNodeContents(pre);const s=window.getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selected';}catch(e){btn.textContent='Select text';}
    }
    setTimeout(()=>{btn.textContent='Copy';},1600);
  });
  refresh();
  return {el:w,refresh};
}

const state={rgba:null,gray:null,name:'Landscape'};

function makeLandscape(){
  const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  g.scale(0.5,0.5);
  const sky=g.createLinearGradient(0,0,0,170);sky.addColorStop(0,'#1d3f87');sky.addColorStop(1,'#f6c48e');
  g.fillStyle=sky;g.fillRect(0,0,256,256);
  g.fillStyle='#fff3cf';g.beginPath();g.arc(188,78,24,0,2*Math.PI);g.fill();
  const poly=(pts,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fill();};
  poly([[0,150],[40,100],[75,130],[120,80],[170,135],[210,105],[256,140],[256,180],[0,180]],'#7a6a8c');
  poly([[0,190],[60,150],[130,175],[200,145],[256,170],[256,256],[0,256]],'#2f4a3a');
  g.fillStyle='#d9d2c3';g.fillRect(30,122,56,70);
  poly([[24,122],[58,98],[92,122]],'#8a3b2e');
  g.fillStyle='#27323f';
  for(let i=0;i<4;i++)for(let j=0;j<4;j++)g.fillRect(36+i*12,130+j*14,8,8);
  poly([[150,200],[165,160],[180,200]],'#173524');poly([[170,205],[188,150],[206,205]],'#173524');
  g.fillStyle='#27506e';g.fillRect(0,206,256,50);
  g.fillStyle='rgba(255,255,255,0.28)';
  for(let y=210;y<256;y+=6)g.fillRect(0,y,256,1);
  return g.getImageData(0,0,S,S).data;
}
function makeCardImage(){
  const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  const bars=['#ffffff','#ffff00','#00ffff','#00ff00','#ff00ff','#ff0000','#0000ff','#000000'];
  bars.forEach((col,i)=>{g.fillStyle=col;g.fillRect(i*16,0,16,40);});
  g.fillStyle='#000';g.fillRect(0,40,S,56);
  g.globalCompositeOperation='lighter';
  [['#ff0000',48,64],['#00ff00',80,64],['#0000ff',64,78]].forEach(a=>{g.fillStyle=a[0];g.beginPath();g.arc(a[1],a[2],22,0,2*Math.PI);g.fill();});
  g.globalCompositeOperation='source-over';
  const gr=g.createLinearGradient(0,0,S,0);gr.addColorStop(0,'#000');gr.addColorStop(1,'#fff');
  g.fillStyle=gr;g.fillRect(0,96,S,32);
  return g.getImageData(0,0,S,S).data;
}

/* ---------- Step 1: pixels ---------- */
function view1(root){
  const RES=[4,8,16,32,64,128];
  let ri=2,nums=true,grid=true,hov=null,timer=null;
  const big=el(`<figure class="card"><figcaption class="cl" id="v1t"></figcaption><canvas width="${BIG}" height="${BIG}" class="big" role="img" aria-label="Grayscale picture drawn as a grid of square pixels"></canvas><p class="cc" id="v1c"></p></figure>`);
  const cv=big.querySelector('canvas');
  const thumb=makeCard('Same picture at full detail','128','');
  const ramp=el('<figure class="card"><figcaption class="cl">What each number means</figcaption><canvas width="256" height="1" class="strip" role="img" aria-label="Ramp from black to white"></canvas><p class="cc"><span class="mono">0</span> is black, <span class="mono">255</span> is white, and everything between is a shade of gray.</p></figure>');
  const rcv=ramp.querySelector('canvas');drawRamp(rcv,x=>x);
  const side=el('<div class="side"></div>');side.append(thumb.el,ramp);
  const split=el('<div class="split"></div>');split.append(big,side);
  const ctl=el(`<div class="controls"><span class="ctl-label">Resolution</span>${seg('res',RES.map((r,i)=>[i,r+' × '+r]),ri)}<button type="button" id="v1-nums" class="tog" aria-pressed="true">Show numbers</button><button type="button" id="v1-grid" class="tog" aria-pressed="true">Show grid</button><button type="button" id="v1-play" class="primary">Add pixels step by step</button></div>`);
  const info=el('<p class="readout" aria-live="polite"></p>');
  const hint=el('<p class="note"></p>');
  root.append(el('<h2>An image is a grid of pixels</h2>'),el('<p class="explain">A digital image is a grid of tiny squares called pixels. Each square holds one number for its brightness. More squares means finer detail. Pick a resolution, or press the animation button to watch the picture sharpen as pixels are added. Point at any square to read its number.</p>'),ctl,split,info,hint);
  const segG=ctl.querySelector('.seg');
  const nb=$('#v1-nums',root),gb=$('#v1-grid',root),pb=$('#v1-play',root);
  let cur=null;
  function halt(){if(timer){clearInterval(timer);timer=null;}pb.textContent='Add pixels step by step';}
  function hoverText(res){
    if(hov==null||hov<0||!cur)return 'Point at a square to read its value.';
    const r=Math.floor(hov/res),c=hov%res;
    return `Row <b>${r}</b>, column <b>${c}</b> → value <b>${cur[hov]}</b> &nbsp;(<span class="mono">img[${r}, ${c}]</span>)`;
  }
  function render(){
    const res=RES[ri];
    cur=downsample(state.gray,res);
    drawCells(cv,cur,res,{grid,numbers:nums,hover:hov});
    big.querySelector('#v1t').textContent=`What the computer stores · ${res} × ${res}`;
    big.querySelector('#v1c').textContent='Each square is one pixel. The shade you see is the number it holds.';
    grayCard(thumb,state.gray);
    thumb.cap.textContent='128 × 128 = 16,384 pixels';
    setSeg(segG,ri);
    info.innerHTML=`<span class="mono">shape = (${res}, ${res})</span> · <b>${fmt(res*res)}</b> pixels · <b>${fmt(res*res)}</b> bytes at 1 byte per pixel<br>${hoverText(res)}`;
    hint.textContent=res>16?'Numbers are only drawn at 16 × 16 or coarser, because the squares get too small to hold them.':(nums?'':'Numbers are hidden. Turn them on to see exactly what is stored.');
    nb.setAttribute('aria-pressed',String(nums));gb.setAttribute('aria-pressed',String(grid));
  }
  segG.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;halt();ri=+b.dataset.v;hov=null;render();});
  nb.addEventListener('click',()=>{nums=!nums;render();});
  gb.addEventListener('click',()=>{grid=!grid;render();});
  cv.addEventListener('pointermove',e=>{const res=RES[ri],p=cellAt(cv,e,res);hov=p.y*res+p.x;render();});
  cv.addEventListener('pointerleave',()=>{hov=null;render();});
  pb.addEventListener('click',()=>{
    if(timer){halt();return;}
    ri=0;hov=null;render();pb.textContent='Stop';
    timer=setInterval(()=>{if(ri>=RES.length-1){halt();return;}ri++;render();},1300);
  });
  return {update:render,stop:halt};
}

/* ---------- Step 2: numbers ---------- */
function view2(root){
  const G=8;
  const px=new Uint8ClampedArray(64);
  let brush=255,hov=-1,sel=0,down=false,preset='smiley';
  const P={
    smiley:['00111100','01000010','10100101','10000001','10100101','10011001','01000010','00111100'],
    heart:['00000000','01100110','11111111','11111111','11111111','01111110','00111100','00011000']
  };
  function load(name){
    preset=name;
    if(P[name]){P[name].forEach((s,r)=>{for(let c=0;c<G;c++)px[r*G+c]=s[c]==='1'?255:0;});}
    else if(name==='gradient'){for(let r=0;r<G;r++)for(let c=0;c<G;c++)px[r*G+c]=Math.round(c/(G-1)*255);}
    else if(name==='checker'){for(let r=0;r<G;r++)for(let c=0;c<G;c++)px[r*G+c]=(r+c)%2?255:40;}
    else if(name==='mine'){px.set(downsample(state.gray,G));}
  }
  load('smiley');
  const cardG=el(`<figure class="card"><figcaption class="cl">Picture · paint here</figcaption><canvas width="${BIG}" height="${BIG}" class="big" style="touch-action:none" role="img" aria-label="Eight by eight grayscale grid you can paint on"></canvas><p class="cc">Click or drag to paint with the brush value.</p></figure>`);
  const cv=cardG.querySelector('canvas');
  const cardM=el('<figure class="card"><figcaption class="cl">Matrix · type here</figcaption><div class="mxwrap"></div><p class="cc">The same 64 numbers. Edit any cell and the picture changes.</p></figure>');
  const tbl=el('<table class="mx" aria-label="Pixel values"></table>');
  const inputs=[];
  for(let r=0;r<G;r++){
    const tr=document.createElement('tr');
    for(let c=0;c<G;c++){
      const td=document.createElement('td');
      const inp=document.createElement('input');
      inp.type='number';inp.min='0';inp.max='255';inp.step='1';inp.inputMode='numeric';
      inp.setAttribute('aria-label',`Row ${r}, column ${c}`);
      const i=r*G+c;
      inp.addEventListener('input',()=>{
        let v=parseInt(inp.value,10);if(isNaN(v))return;
        v=clampB(v);if(String(v)!==inp.value)inp.value=String(v);
        px[i]=v;styleCell(i);sel=i;render(false);
      });
      inp.addEventListener('focus',()=>{hov=i;sel=i;render(false);});
      inp.addEventListener('blur',()=>{hov=-1;render(false);});
      inp.addEventListener('mouseenter',()=>{hov=i;sel=i;render(false);});
      inp.addEventListener('mouseleave',()=>{hov=-1;render(false);});
      td.appendChild(inp);tr.appendChild(td);inputs.push(inp);
    }
    tbl.appendChild(tr);
  }
  cardM.querySelector('.mxwrap').appendChild(tbl);
  function styleCell(i){const v=px[i],inp=inputs[i];inp.style.background=`rgb(${v},${v},${v})`;inp.style.color=v>140?'#000':'#fff';}
  const grid=el('<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))"></div>');grid.append(cardG,cardM);
  const ctl=el(`<div class="controls"><span class="ctl-label">Start from</span>${seg('pre',[['smiley','Smiley'],['heart','Heart'],['gradient','Gradient'],['checker','Checkerboard'],['mine','Your image']],'smiley')}</div>`);
  const ctl2=el(`<div class="controls">${slider('b-v','Brush value',0,255,255)}<button type="button" data-b="0">Black 0</button><button type="button" data-b="128">Gray 128</button><button type="button" data-b="255">White 255</button><span id="b-sw" style="display:inline-block;width:34px;height:34px;border:1px solid var(--line);border-radius:4px" aria-hidden="true"></span></div>`);
  const info=el('<p class="readout" aria-live="polite"></p>');
  const code=codeBlock(()=>{
    const lines=[];
    for(let r=0;r<G;r++)lines.push('    ['+Array.from(px.slice(r*G,r*G+G)).map(v=>String(v).padStart(3)).join(', ')+'],');
    const r=Math.floor(sel/G),c=sel%G;
    return 'img = np.array([\n'+lines.join('\n')+'\n], dtype=np.uint8)\n\nprint(img.shape)        # (8, 8)\nprint(img['+r+', '+c+'])      # '+px[sel]+'   (row '+r+', column '+c+')';
  });
  root.append(el('<h2>What the computer actually sees</h2>'),el('<p class="explain">A computer never sees a picture. It holds a matrix of numbers, and the picture is just those numbers drawn as shades. Paint on the grid or type in the table: both always show the same data. Pointing at a cell on one side highlights it on the other.</p>'),ctl,ctl2,grid,info,el('<p class="ctl-label" style="margin:0 0 6px">The same data as Python code</p>'),code.el);
  const sw=$('#b-sw',root);
  const bs=bindSlider(root,'b-v',v=>{brush=v;sw.style.background=`rgb(${v},${v},${v})`;});
  sw.style.background='rgb(255,255,255)';
  ctl2.querySelectorAll('button[data-b]').forEach(b=>b.addEventListener('click',()=>{brush=+b.dataset.b;bs.set(brush);sw.style.background=`rgb(${brush},${brush},${brush})`;}));
  bindSeg(root,'pre',v=>{load(v);syncAll();render(false);});
  function paint(e){
    const p=cellAt(cv,e,G),i=p.y*G+p.x;
    sel=i;hov=i;px[i]=brush;inputs[i].value=String(brush);styleCell(i);render(false);
  }
  cv.addEventListener('pointerdown',e=>{down=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}paint(e);});
  cv.addEventListener('pointermove',e=>{
    if(down){paint(e);return;}
    const p=cellAt(cv,e,G);hov=p.y*G+p.x;sel=hov;render(false);
  });
  cv.addEventListener('pointerup',()=>{down=false;});
  cv.addEventListener('pointercancel',()=>{down=false;});
  cv.addEventListener('pointerleave',()=>{if(!down){hov=-1;render(false);}});
  function syncAll(){for(let i=0;i<64;i++){inputs[i].value=String(px[i]);styleCell(i);}}
  function render(full){
    drawCells(cv,px,G,{grid:true,numbers:false,hover:hov});
    inputs.forEach((inp,i)=>inp.classList.toggle('hl',i===hov));
    const r=Math.floor(sel/G),c=sel%G;
    info.innerHTML=`<span class="mono">shape = (8, 8)</span> · 64 numbers · Row <b>${r}</b>, column <b>${c}</b> → <b>${px[sel]}</b> (<span class="mono">img[${r}, ${c}]</span>). Rows count down from 0 at the top, columns count across from 0 at the left.`;
    code.refresh();
  }
  return {update(){if(preset==='mine'){load('mine');}syncAll();render(true);},stop(){down=false;}};
}

/* ---------- Step 3: gray levels ---------- */
function view3(root){
  let bits=8,timer=null;
  const a=makeCard('Original · 256 levels','128','8 bits per pixel'),b=makeCard('','128','');
  const cards=el('<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))"></div>');cards.append(a.el,b.el);
  const rampCard=el('<figure class="card"><figcaption class="cl">The same black-to-white ramp</figcaption><canvas width="256" height="1" class="strip" role="img" aria-label="Original ramp"></canvas><canvas width="256" height="1" class="strip" role="img" aria-label="Ramp with fewer gray levels"></canvas><p class="cc">Top: all 256 shades. Bottom: only the shades available with the chosen bits. Each flat band is one level.</p></figure>');
  const rc=rampCard.querySelectorAll('canvas');drawRamp(rc[0],x=>x);
  const ctl=el(`<div class="controls">${slider('bits','Bits per pixel',1,8,8)}<button type="button" id="bt-play" class="primary">Drop one bit at a time</button></div>`);
  const info=el('<p class="readout" aria-live="polite"></p>');
  const chipsWrap=el('<div class="chips" aria-label="Available gray levels"></div>');
  const note=el('<p class="note"></p>');
  root.append(el('<h2>How many gray shades can each pixel hold?</h2>'),el('<p class="explain">Pixels are one axis of quality. The other is how finely each pixel\'s brightness is stored. A pixel stored with <b>n</b> bits can take 2<sup>n</sup> different values. With 8 bits that is 256 shades (0 to 255), which looks smooth. With fewer bits, smooth areas break into visible bands.</p>'),ctl,cards,rampCard,info,el('<p class="ctl-label" style="margin:12px 0 6px">The shades you can use</p>'),chipsWrap,note);
  const playB=$('#bt-play',root);
  const sl=bindSlider(root,'bits',v=>{halt();bits=v;render();});
  function halt(){if(timer){clearInterval(timer);timer=null;}playB.textContent='Drop one bit at a time';}
  function render(){
    const L=1<<bits;
    grayCard(a,state.gray);
    paintCard(b,(i,d,o)=>{const v=quant(state.gray[i],bits);d[o]=d[o+1]=d[o+2]=v;});
    b.lab.textContent=`${bits}-bit · ${fmt(L)} level${L===1?'':'s'}`;
    b.cap.textContent=bits===8?'Identical to the original.':'Fewer shades, so gradients turn into bands.';
    drawRamp(rc[1],x=>quant(x,bits));
    const bytes=SS*bits/8;
    info.innerHTML=`<b>${bits}</b> bit${bits===1?'':'s'} → 2<sup>${bits}</sup> = <b>${fmt(L)}</b> gray levels · size of this image: ${fmt(SS)} pixels × ${bits} bits = <b>${fmt(bytes)}</b> bytes`;
    chipsWrap.innerHTML='';
    if(L<=16){
      for(let k=0;k<L;k++){
        const v=Math.round(k*255/(L-1||1));
        const s=document.createElement('span');s.className='chip';s.textContent=String(L===1?0:v);
        const vv=L===1?0:v;s.style.background=`rgb(${vv},${vv},${vv})`;s.style.color=vv>140?'#000':'#fff';
        chipsWrap.appendChild(s);
      }
      note.textContent=L===2?'With 1 bit every pixel is either black or white. This is a binary image, the kind used for the morphology work.':'These are the only values any pixel can have.';
    }else{
      const step=(255/(L-1)).toFixed(L>=64?1:1);
      const s=document.createElement('span');s.className='chip';s.textContent=`${fmt(L)} levels, about ${step} apart`;s.style.minWidth='0';chipsWrap.appendChild(s);
      note.textContent='Too many to list. The step between neighbouring shades is small, so your eye cannot see the bands.';
    }
  }
  playB.addEventListener('click',()=>{
    if(timer){halt();return;}
    bits=8;sl.set(8);render();playB.textContent='Stop';
    timer=setInterval(()=>{if(bits<=1){halt();return;}bits--;sl.set(bits);render();},1100);
  });
  return {update:render,stop:halt};
}

/* ---------- Step 4: colour ---------- */
function view4(root){
  let sel={x:64,y:40},mask=[true,true,true],tint=false;
  const comp=makeCard('Colour image','128','Red + green + blue added together','pick');
  const chs=[makeCard('<span class="r">Red</span> channel','128','','pick'),makeCard('<span class="g">Green</span> channel','128','','pick'),makeCard('<span class="b">Blue</span> channel','128','','pick')];
  const cards=el('<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))"></div>');cards.append(comp.el,...chs.map(c=>c.el));
  const ctl=el(`<div class="controls"><span class="ctl-label">Show in the colour image</span><button type="button" class="tog" data-ch="0" aria-pressed="true"><span class="r">R</span> red</button><button type="button" class="tog" data-ch="1" aria-pressed="true"><span class="g">G</span> green</button><button type="button" class="tog" data-ch="2" aria-pressed="true"><span class="b">B</span> blue</button><span class="ctl-label" style="margin-left:8px">Channels drawn as</span>${seg('tint',[['gray','Gray'],['tint','Tinted']],'gray')}</div>`);
  const info=el('<p class="readout" aria-live="polite"></p>');
  const insp=el('<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))"></div>');
  const pcard=el('<figure class="card"><figcaption class="cl">Selected pixel</figcaption><div class="swatch" id="p-sw"></div><p class="cc" id="p-t"></p></figure>');
  const ncard=el('<figure class="card"><figcaption class="cl">Its 3 × 3 neighbourhood in each channel</figcaption><div id="p-nb" style="display:flex;flex-wrap:wrap;gap:10px"></div><p class="cc">Every channel is a plain gray matrix. The outlined cell is the pixel you picked.</p></figure>');
  const mcard=el(`<figure class="card"><figcaption class="cl">Mix your own colour</figcaption><div class="swatch" id="m-sw"></div>${slider('m-r','<span class="r">R</span>',0,255,0)}${slider('m-g','<span class="g">G</span>',0,255,0)}${slider('m-b','<span class="b">B</span>',0,255,0)}<p class="cc" id="m-t"></p></figure>`);
  insp.append(pcard,ncard,mcard);
  root.append(el('<h2>Colour is three matrices</h2>'),el('<p class="explain">A colour image stores three gray matrices, one each for red, green and blue. One pixel is the triple (R, G, B). Click any picture to inspect that pixel. Switch channels off to see what each contributes. Try the colour test card: its red, green and blue circles overlap to make cyan, magenta, yellow and white.</p>'),ctl,cards,info,insp);
  const mr=bindSlider(mcard,'m-r',()=>mix()),mg=bindSlider(mcard,'m-g',()=>mix()),mb=bindSlider(mcard,'m-b',()=>mix());
  function mix(){
    const r=mr.get(),g=mg.get(),b=mb.get();
    $('#m-sw',mcard).style.background=`rgb(${r},${g},${b})`;
    const gr=Math.round(0.299*r+0.587*g+0.114*b);
    $('#m-t',mcard).innerHTML=`<span class="rgbtag">(${r}, ${g}, ${b})</span> → gray <span class="rgbtag">${gr}</span>. Red-only, green-only and blue-only light adds up to the colour you see.`;
  }
  function ring(card){
    const g=card.ctx,x=sel.x,y=sel.y;
    g.save();g.lineWidth=4;g.strokeStyle='#fff';g.strokeRect(x-2.5,y-2.5,6,6);
    g.lineWidth=2;g.strokeStyle=css('--accent');g.strokeRect(x-2.5,y-2.5,6,6);g.restore();
  }
  function render(){
    const d=state.rgba;
    paintCard(comp,(i,o,k)=>{o[k]=mask[0]?d[i*4]:0;o[k+1]=mask[1]?d[i*4+1]:0;o[k+2]=mask[2]?d[i*4+2]:0;});
    chs.forEach((c,k)=>paintCard(c,(i,o,q)=>{const v=d[i*4+k];if(tint){o[q]=k===0?v:0;o[q+1]=k===1?v:0;o[q+2]=k===2?v:0;}else{o[q]=o[q+1]=o[q+2]=v;}}));
    [comp,...chs].forEach(ring);
    chs.forEach((c,k)=>{c.cap.textContent=`A ${S} × ${S} matrix of values 0 to 255`;});
    const i=sel.y*S+sel.x,R=d[i*4],G=d[i*4+1],B=d[i*4+2],gr=Math.round(0.299*R+0.587*G+0.114*B);
    info.innerHTML=`<span class="mono">img.shape = (${S}, ${S}, 3)</span> · 3 matrices × ${fmt(SS)} pixels = <b>${fmt(SS*3)}</b> numbers`;
    $('#p-sw',pcard).style.background=`rgb(${R},${G},${B})`;
    $('#p-t',pcard).innerHTML=`Row <b>${sel.y}</b>, column <b>${sel.x}</b><br>(R, G, B) = (<span class="r rgbtag">${R}</span>, <span class="g rgbtag">${G}</span>, <span class="b rgbtag">${B}</span>)<br>OpenCV loads it as [B, G, R] = [${B}, ${G}, ${R}]<br>gray = 0.299×${R} + 0.587×${G} + 0.114×${B} = <b>${gr}</b>`;
    const nbHost=$('#p-nb',ncard);nbHost.innerHTML='';
    [['R',0,'r'],['G',1,'g'],['B',2,'b']].forEach(t=>{
      let h=`<div><div class="${t[2]} rgbtag" style="margin-bottom:2px">${t[0]}</div><table class="nb">`;
      for(let dy=-1;dy<=1;dy++){h+='<tr>';for(let dx=-1;dx<=1;dx++){
        const x=sel.x+dx,y=sel.y+dy,ok=x>=0&&y>=0&&x<S&&y<S;
        h+=`<td class="${dx===0&&dy===0?'mid':''}">${ok?d[(y*S+x)*4+t[1]]:'·'}</td>`;
      }h+='</tr>';}
      h+='</table></div>';nbHost.insertAdjacentHTML('beforeend',h);
    });
    if(mix.last!==i||mix.img!==state.rgba){mix.last=i;mix.img=state.rgba;mr.set(R);mg.set(G);mb.set(B);}
    mix();
  }
  [comp,...chs].forEach(c=>c.cv.addEventListener('click',e=>{sel=cellAt(c.cv,e,S);render();}));
  ctl.querySelectorAll('button[data-ch]').forEach(b=>b.addEventListener('click',()=>{
    const k=+b.dataset.ch;mask[k]=!mask[k];b.setAttribute('aria-pressed',String(mask[k]));render();
  }));
  bindSeg(root,'tint',v=>{tint=v==='tint';render();});
  return {update:render,stop(){}};
}

const steps=[
  {short:'Pixels',build:view1},
  {short:'Numbers',build:view2},
  {short:'Gray levels',build:view3},
  {short:'Colour',build:view4}
];
const stage=$('#stage'),nav=$('#steps');
const panels=[],views=[];
let cur=0;
steps.forEach((s,i)=>{
  const b=el(`<button type="button"><b>${i+1}</b><span>${s.short}</span></button>`);
  b.addEventListener('click',()=>go(i));
  nav.appendChild(b);
  const p=el('<section class="panel"></section>');p.hidden=true;stage.appendChild(p);panels.push(p);views.push(null);
});
function go(i){
  if(views[cur])views[cur].stop();
  cur=i;
  panels.forEach((p,j)=>{p.hidden=j!==i;});
  nav.querySelectorAll('button').forEach((b,j)=>{if(j===i)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
  if(!views[i])views[i]=steps[i].build(panels[i]);
  views[i].update();
  $('#back').hidden=i===0;
  $('#next').textContent=i===steps.length-1?'Start again':'Next';
}
$('#back').addEventListener('click',()=>go(Math.max(0,cur-1)));
$('#next').addEventListener('click',()=>go(cur===steps.length-1?0:cur+1));

function setImage(rgba,name){
  state.rgba=rgba;state.gray=grayFromRGBA(rgba);state.name=name;
  if(views[cur])views[cur].update();
}
const srcBtns=[...document.querySelectorAll('#src button')];
function setSource(v){srcBtns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));}
const msg=$('#srcmsg'),DEFAULT_MSG='Stored as 128 × 128 pixels. Everything runs in your browser.';
$('#src').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const v=b.dataset.v;
  if(v==='landscape'){setSource(v);msg.textContent=DEFAULT_MSG;setImage(makeLandscape(),'Landscape');}
  else if(v==='card'){setSource(v);msg.textContent=DEFAULT_MSG;setImage(makeCardImage(),'Test card');}
  else{$('#file').click();}
});
$('#file').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  if(!/^image\//.test(f.type)){msg.textContent='Choose an image file such as PNG or JPG.';return;}
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
      const s=Math.min(im.width,im.height);
      g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,S,S);
      setSource('upload');msg.textContent=f.name+' · cropped to a square and shrunk to 128 × 128.';
      setImage(g.getImageData(0,0,S,S).data,f.name);
    };
    im.onerror=()=>{msg.textContent='That file could not be read as an image.';};
    im.src=r.result;
  };
  r.onerror=()=>{msg.textContent='That file could not be read.';};
  r.readAsDataURL(f);
  e.target.value='';
});
if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const rr=()=>{if(views[cur])views[cur].update();};
  if(mq.addEventListener)mq.addEventListener('change',rr);
}
state.rgba=makeLandscape();state.gray=grayFromRGBA(state.rgba);
go(0);
</script>
