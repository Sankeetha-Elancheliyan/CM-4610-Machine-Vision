<title>Image Segmentation Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one wide column. Source picker, step tabs, then a stage of cards. Blue always means the input or original, orange the output or result, rose outline the thing you are pointing at. */
:root{
  --bg:#F3F4F7;--surface:#FFFFFF;--ink:#111827;--muted:#566074;--line:#CFD5E0;
  --accent:#C2185B;--in:#2A58C8;--out:#C4510C;--ok:#1E8A4C;--bad:#C62828;--tone:var(--ink);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1319;--surface:#171C25;--ink:#E8ECF3;--muted:#9AA5B8;--line:#2B3340;
    --accent:#FF6FA5;--in:#7FA6FF;--out:#FF9A5C;--ok:#5FD39A;--bad:#FF8A8A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1319;--surface:#171C25;--ink:#E8ECF3;--muted:#9AA5B8;--line:#2B3340;
  --accent:#FF6FA5;--in:#7FA6FF;--out:#FF9A5C;--ok:#5FD39A;--bad:#FF8A8A;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
main{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-0.015em;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,3.4vw,26px);line-height:1.2;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.25;margin:22px 0 6px}
.lede{margin:8px 0 0;color:var(--muted);max-width:62ch}
.eyebrow,.cl,.ctl-label{font-family:var(--font-mono);font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer;min-height:38px}
button:hover{border-color:var(--ink)}
button:active{transform:scale(0.98)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed="true"],button.tog[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 11%,var(--surface));border-color:var(--ink);font-weight:500}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.primary:hover{filter:brightness(1.15)}
.steps{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:12px}
.steps button{display:flex;gap:8px;align-items:baseline}
.steps button b{font-family:var(--font-mono);font-weight:500;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps button[aria-current="step"] b{color:var(--bg)}
.panel[hidden]{display:none}
.explain{margin:0 0 16px;max-width:70ch;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px;margin-bottom:16px}
.card{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.card canvas{width:100%;height:auto;aspect-ratio:1;display:block;background:#000;border-radius:3px;image-rendering:pixelated}
.card canvas.pick{cursor:crosshair}
.card canvas.chart{aspect-ratio:1;background:var(--surface);image-rendering:auto}
.card canvas.wide{aspect-ratio:512/170;background:var(--surface);image-rendering:auto}
.card canvas.rulers{aspect-ratio:720/250;background:var(--surface);image-rendering:auto}
.cc{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
.cl{margin:0}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-bottom:12px}
.controls[hidden]{display:none}
.ctl{display:flex;align-items:center;gap:10px;font-size:14px}
.ctl input[type=range]{width:min(220px,46vw);accent-color:var(--ink)}
.ctl output{font-family:var(--font-mono);font-size:13px;min-width:3.4em;font-variant-numeric:tabular-nums}
.readout{margin:0 0 6px;font-size:15px;min-height:24px}
.readout b,.mono{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums}
.note{margin:6px 0 0;font-size:14px;color:var(--muted);max-width:72ch}
.formula{font-family:var(--font-mono);font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 12px;overflow-x:auto;white-space:nowrap}
.callout{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:8px;padding:12px 14px;margin:0 0 16px;max-width:72ch}
.callout p{margin:0}
.callout .mono{font-size:14px}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
table.t td.num,table.t th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
table.t tr[hidden]{display:none}
table.t tr.cur td{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;margin:0 0 14px}
.q p{margin:0}
.tag{font-family:var(--font-mono);font-size:11px;letter-spacing:0.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--muted);align-self:flex-start}
.ans{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans input[type=text],table.sum input{height:36px;font:inherit;font-family:var(--font-mono);font-size:14px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.ans input[type=text]{width:130px}
.fb{font-size:14px;min-height:20px}
.fb.ok,.okc{color:var(--ok)}
.fb.bad,.badc{color:var(--bad)}
.sol{border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:14px;color:var(--muted)}
.sol p{margin:2px 0}
.sol[hidden]{display:none}
.opts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.opts button{text-align:left}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.score{font-family:var(--font-mono);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:0 0 14px;padding:0;list-style:none}
.facts li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.facts li b{display:block;font-family:var(--font-display);font-weight:600;font-size:15px;margin-bottom:2px}
.facts li span{color:var(--muted)}
.code{position:relative;margin:0 0 14px}
.code pre{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;font-family:var(--font-mono);font-size:13px;line-height:1.55}
.code button{position:absolute;top:8px;right:8px;min-height:30px;padding:3px 10px;font-size:12px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px}
.small{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion: reduce){button:active{transform:none}}

</style>

<main>
  <header>
    <p class="eyebrow" style="margin:0 0 8px">Machine vision · segmentation</p>
    <h1>Image segmentation lab</h1>
    <p class="lede">Otsu thresholding, K-means, mean shift, split and merge and watershed side by side, then contours: area, perimeter and compactness.</p>
  </header>

  <section class="row" aria-label="Choose an image">
    <span class="ctl-label">Image</span>
    <div class="seg" id="src">
      <button type="button" data-v="coins" aria-pressed="true">Coins</button>
      <button type="button" data-v="landscape" aria-pressed="false">Landscape</button>
      <button type="button" data-v="upload" aria-pressed="false">Upload your own</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <span class="small" id="srcmsg">Stored as 128 × 128 gray pixels. Everything runs in your browser.</span>
  </section>

  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <div id="stage"></div>
  <div class="foot">
    <button type="button" id="back">Back</button>
    <button type="button" id="next" class="primary">Next</button>
  </div>
</main>

<script>
//CORE-START
const S=128,SS=S*S;
function clamp8(v){return v<0?0:v>255?255:v;}
function histo(a){const h=new Uint32Array(256);for(let i=0;i<a.length;i++)h[a[i]]++;return h;}
function minMax(a){let mn=255,mx=0;for(let i=0;i<a.length;i++){if(a[i]<mn)mn=a[i];if(a[i]>mx)mx=a[i];}return [mn,mx];}
function cumul(h){const c=new Float64Array(h.length);let s=0;for(let i=0;i<h.length;i++){s+=h[i];c[i]=s;}return c;}
function stretchRaw(v,imin,imax,omin,omax){return (v-imin)/(imax-imin)*(omax-omin)+omin;}
function stretch8(v,imin,imax){return clamp8(Math.round(stretchRaw(v,imin,imax,0,255)));}
function pctLimits(h,n,p){
  const c=cumul(h);let lo=0,hi=255;
  for(let v=0;v<256;v++){if(c[v]>p*n){lo=v;break;}}
  for(let v=255;v>=0;v--){const above=n-(v>0?c[v-1]:0);if(above>p*n){hi=v;break;}}
  return [lo,hi];
}
function peakLimits(h,f){
  let mx=0;for(let i=0;i<256;i++)if(h[i]>mx)mx=h[i];
  const thr=f*mx;let lo=0,hi=255;
  for(let v=0;v<256;v++){if(h[v]>thr){lo=v;break;}}
  for(let v=255;v>=0;v--){if(h[v]>thr){hi=v;break;}}
  return [lo,hi,thr];
}
function eqLUT(h,n,mode){
  const L=h.length,lut=new Array(L);let s=0;
  for(let k=0;k<L;k++){s+=h[k];const x=(L-1)*s/n;lut[k]=mode==='floor'?Math.floor(x+1e-9):Math.round(x);}
  return lut;
}
function eqLUTcv(h,n){
  const lut=new Array(256).fill(0);let i=0;
  while(i<256&&h[i]===0)i++;
  if(i===256)return lut;
  if(h[i]===n)return lut.fill(i);
  const scale=255/(n-h[i]);let sum=0;lut[i]=0;i++;
  for(;i<256;i++){sum+=h[i];lut[i]=Math.round(sum*scale);}
  return lut;
}
function applyLUT(a,lut){const o=new Uint8ClampedArray(a.length);for(let i=0;i<a.length;i++)o[i]=lut[a[i]];return o;}
function gammaV(v,g){return Math.round(255*Math.pow(v/255,g));}
function linV(v,k,b){return clamp8(Math.round((v-128)*k+128+b));}
function sCurveV(v,k){const x=v/255-0.5;return clamp8(Math.round(255*(Math.tanh(k*x)/(2*Math.tanh(k/2))+0.5)));}
function meanStd(a){let s=0;for(let i=0;i<a.length;i++)s+=a[i];const m=s/a.length;let q=0;for(let i=0;i<a.length;i++){const d=a[i]-m;q+=d*d;}return [m,Math.sqrt(q/a.length)];}
function levelsUsed(h){let c=0;for(let i=0;i<h.length;i++)if(h[i])c++;return c;}
function lcg(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
function makeDull(base,c,shift){
  const lo=(255-255*c)/2,o=new Uint8ClampedArray(base.length);
  for(let i=0;i<base.length;i++)o[i]=clamp8(Math.round(lo+base[i]*c+shift));
  return o;
}
function addOutliers(a){
  const o=Uint8ClampedArray.from(a);
  for(let k=0;k<16;k++){const i=(k*2711+97)%a.length;o[i]=k%2?0:255;}
  return o;
}
//CORE-END

const BIG=720;
const $=(s,r)=>(r||document).querySelector(s);
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function fmt(n){return n.toLocaleString('en-US');}
function num(x,d){const k=Math.pow(10,d==null?3:d);const r=Math.round(x*k)/k;return String(Object.is(r,-0)?0:r);}
function seg(name,opts,cur){return `<div class="seg" data-name="${name}" role="group">${opts.map(o=>`<button type="button" data-v="${o[0]}" aria-pressed="${String(o[0])===String(cur)}">${o[1]}</button>`).join('')}</div>`;}
function bindSeg(root,name,cb){
  const g=root.querySelector(`.seg[data-name="${name}"]`);
  g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));cb(b.dataset.v);});
  return g;
}
function slider(id,label,min,max,val,step,suffix){
  return `<label class="ctl" for="${id}"><span>${label}</span><input type="range" id="${id}" min="${min}" max="${max}" value="${val}" step="${step||1}"><output id="${id}-o" for="${id}">${val}${suffix||''}</output></label>`;
}
function bindSlider(root,id,cb,suffix){
  const s=root.querySelector('#'+id),o=root.querySelector('#'+id+'-o');
  const show=v=>{o.textContent=num(v,2)+(suffix||'');};
  s.addEventListener('input',()=>{show(+s.value);cb(+s.value);});
  return {set(v){s.value=v;show(+s.value);},get:()=>+s.value,el:s};
}
function animate(dur,fn,onEnd){
  const t0=performance.now();let id=0;
  function f(t){const p=Math.min(1,Math.max(0,(t-t0)/dur));fn(p);if(p<1)id=requestAnimationFrame(f);else{id=0;if(onEnd)onEnd();}}
  id=requestAnimationFrame(f);
  return()=>{if(id)cancelAnimationFrame(id);id=0;};
}
function cellAt(cv,e,n){
  const r=cv.getBoundingClientRect();
  let x=Math.floor((e.clientX-r.left)/r.width*n),y=Math.floor((e.clientY-r.top)/r.height*n);
  x=Math.max(0,Math.min(n-1,x));y=Math.max(0,Math.min(n-1,y));
  return {x,y};
}
function imgCard(label,extra,cap){
  const c=el(`<figure class="card"><figcaption class="cl">${label}</figcaption><canvas width="${S}" height="${S}" class="${extra||''}" role="img" aria-label="${label.replace(/<[^>]*>/g,'')}"></canvas><p class="cc">${cap||''}</p></figure>`);
  const cv=c.querySelector('canvas'),ctx=cv.getContext('2d');
  return {el:c,cv,ctx,img:ctx.createImageData(S,S),cap:c.querySelector('.cc'),lab:c.querySelector('.cl')};
}
function grayCard(card,arr){
  const d=card.img.data;
  for(let i=0;i<SS;i++){const o=i*4;d[o]=d[o+1]=d[o+2]=arr[i];d[o+3]=255;}
  card.ctx.putImageData(card.img,0,0);
}
function histCard(label,cap,w,h){
  const c=el(`<figure class="card"><figcaption class="cl">${label}</figcaption><canvas width="${w||512}" height="${h||170}" class="wide" role="img" aria-label="${label.replace(/<[^>]*>/g,'')}"></canvas><p class="cc">${cap||''}</p></figure>`);
  return {el:c,cv:c.querySelector('canvas'),cap:c.querySelector('.cc'),lab:c.querySelector('.cl')};
}
function chartCard(label,cap){
  const c=el(`<figure class="card"><figcaption class="cl">${label}</figcaption><canvas width="300" height="300" class="chart" role="img" aria-label="${label.replace(/<[^>]*>/g,'')}"></canvas><p class="cc">${cap||''}</p></figure>`);
  return {el:c,cv:c.querySelector('canvas'),cap:c.querySelector('.cc'),lab:c.querySelector('.cl')};
}
function histDraw(cv,h,o){
  o=o||{};
  const g=cv.getContext('2d'),W=cv.width,H=cv.height,pb=16,pt=8;
  const cMain=css(o.color||'--in'),cLine=css('--line'),cMut=css('--muted'),cAcc=css('--accent');
  g.clearRect(0,0,W,H);g.fillStyle=css('--surface');g.fillRect(0,0,W,H);
  let mx=o.max||1;if(!o.max){for(let i=0;i<h.length;i++)if(h[i]>mx)mx=h[i];}
  const bw=W/h.length,ph=H-pb-pt;
  for(let i=0;i<h.length;i++){
    const hh=h[i]/mx*ph;
    g.fillStyle=(o.shade!=null&&i>o.shade)?cLine:cMain;
    g.fillRect(i*bw,H-pb-hh,bw+0.5,hh);
  }
  g.fillStyle=cMut;g.fillRect(0,H-pb,W,1);
  g.font='11px "JetBrains Mono",monospace';g.textBaseline='alphabetic';
  [0,64,128,192,255].forEach(v=>{const x=(v+0.5)*W/256;g.fillRect(x,H-pb,1,4);g.textAlign=v===0?'left':v===255?'right':'center';g.fillText(String(v),v===0?1:v===255?W-1:x,H-3);});
  if(o.cdf){
    const c=cumul(h),tot=c[c.length-1]||1;g.strokeStyle=css('--ok');g.lineWidth=2;g.beginPath();
    for(let i=0;i<h.length;i++){const x=(i+0.5)*bw,y=H-pb-c[i]/tot*ph;if(i===0)g.moveTo(x,y);else g.lineTo(x,y);}
    g.stroke();
  }
  if(o.hline!=null){
    const y=H-pb-o.hline/mx*ph;g.strokeStyle=cAcc;g.lineWidth=1.5;g.setLineDash([5,4]);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();g.setLineDash([]);
  }
  (o.markers||[]).forEach(m=>{
    const x=(m.x+0.5)*bw;g.strokeStyle=m.color||cAcc;g.lineWidth=2;g.beginPath();g.moveTo(x,pt-4);g.lineTo(x,H-pb);g.stroke();
    if(m.label){g.fillStyle=m.color||cAcc;g.textAlign=m.x>200?'right':'left';g.fillText(m.label,x+(m.x>200?-4:4),pt+6);}
  });
}
function mapDraw(cv,series,o){
  o=o||{};
  const g=cv.getContext('2d'),W=cv.width,H=cv.height,pl=30,pr=10,pt=10,pb=26;
  const xd=o.xdom||[0,255],yd=o.ydom||[0,255];
  const fx=x=>pl+(x-xd[0])/(xd[1]-xd[0])*(W-pl-pr),fy=y=>H-pb-(y-yd[0])/(yd[1]-yd[0])*(H-pb-pt);
  g.clearRect(0,0,W,H);g.fillStyle=css('--surface');g.fillRect(0,0,W,H);
  const D=o.div||4,ks=Array.from({length:D+1},(_,i)=>i);
  g.strokeStyle=css('--line');g.lineWidth=1;g.beginPath();
  ks.forEach(k=>{const x=pl+k*(W-pl-pr)/D,y=pt+k*(H-pt-pb)/D;g.moveTo(x,pt);g.lineTo(x,H-pb);g.moveTo(pl,y);g.lineTo(W-pr,y);});
  g.stroke();
  g.fillStyle=css('--muted');g.font='11px "JetBrains Mono",monospace';g.textBaseline='alphabetic';
  g.textAlign='center';ks.forEach(k=>{const v=xd[0]+k*(xd[1]-xd[0])/D;g.fillText(num(v,xd[1]-xd[0]>=20?0:2),pl+k*(W-pl-pr)/D,H-12);});
  g.textAlign='right';ks.forEach(k=>{const v=yd[0]+k*(yd[1]-yd[0])/D;g.fillText(num(v,yd[1]-yd[0]>=20?0:2),pl-4,H-pb-k*(H-pt-pb)/D+4);});
  g.textAlign='right';g.fillText(o.xl||'input →',W-pr,H-1);g.textAlign='left';g.fillText(o.yl||'output ↑',pl+4,pt+9);
  if(!o.nodiag&&xd[0]===yd[0]&&xd[1]===yd[1]){
    g.setLineDash([4,4]);g.strokeStyle=css('--muted');g.lineWidth=1;g.beginPath();g.moveTo(fx(xd[0]),fy(yd[0]));g.lineTo(fx(xd[1]),fy(yd[1]));g.stroke();g.setLineDash([]);
  }
  series.forEach(s=>{
    const pts=s.pts||Array.from(s.lut,(y,x)=>[x,y]);
    g.strokeStyle=s.color?css(s.color):css('--ink');g.lineWidth=s.w||2.5;
    g.setLineDash(s.dash||[]);g.beginPath();

function edt(mask){
  const INF=1e20,f=new Float64Array(SS),tmp=new Float64Array(SS),out=new Float64Array(SS);
  for(let i=0;i<SS;i++)f[i]=mask[i]?INF:0;
  const v=new Int32Array(S),z=new Float64Array(S+1),g=new Float64Array(S),dd=new Float64Array(S);
  const dt1=(src,dst)=>{
    let k=0;v[0]=0;z[0]=-INF;z[1]=INF;
    for(let q=1;q<S;q++){
      let s;
      while(true){const p=v[k];s=((src[q]+q*q)-(src[p]+p*p))/(2*q-2*p);if(s<=z[k]&&k>0)k--;else break;}
      if(s<=z[k]&&k===0){v[0]=q;z[0]=-INF;z[1]=INF;continue;}
      k++;v[k]=q;z[k]=s;z[k+1]=INF;
    }
    k=0;for(let q=0;q<S;q++){while(z[k+1]<q)k++;dst[q]=(q-v[k])*(q-v[k])+src[v[k]];}
  };
  for(let x=0;x<S;x++){for(let y=0;y<S;y++)g[y]=f[y*S+x];dt1(g,dd);for(let y=0;y<S;y++)tmp[y*S+x]=dd[y];}

  return out;
}
function morph(mask,op,iters){
  let a=Uint8Array.from(mask);

    const b=new Uint8Array(SS);

      let v=op==='erode'?1:0;
      for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
        const xx=x+i,yy=y+j;const u=(xx<0||yy<0||xx>=S||yy>=S)?(op==='erode'?1:0):a[yy*S+xx];
        if(op==='erode'){if(!u)v=0;}else if(u)v=1;
      }

    }

  }

}
function ccLabel(mask,conn8){
  const L=new Int32Array(SS),st=[];let n=0;

      const p=st.pop(),x=p%S,y=(p/S)|0;

function compStats(L,n,nb8){
  const st=Array.from({length:n+1},()=>({area:0,per:0,sx:0,sy:0,x0:S,y0:S,x1:-1,y1:-1}));
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const l=L[y*S+x];if(!l)continue;const s=st[l];
    s.area++;s.sx+=x;s.sy+=y;if(x<s.x0)s.x0=x;if(y<s.y0)s.y0=y;if(x>s.x1)s.x1=x;if(y>s.y1)s.y1=y;

    for(let j=-1;j<=1&&!edge;j++)for(let i=-1;i<=1;i++){
      if(!i&&!j)continue;if(!nb8&&i&&j)continue;
      const xx=x+i,yy=y+j;if(xx<0||yy<0||xx>=S||yy>=S||L[yy*S+xx]!==l){edge=true;break;}
    }
    if(edge)s.per++;

  for(let l=1;l<=n;l++){const s=st[l];s.cx=s.sx/s.area;s.cy=s.sy/s.area;s.compact=s.per*s.per/(4*Math.PI*s.area);}

function wsRun(rgba,markers){
  const L=Int32Array.from(markers),Q=Array.from({length:766},()=>[]);
  const cost=(p,q)=>Math.abs(rgba[p*4]-rgba[q*4])+Math.abs(rgba[p*4+1]-rgba[q*4+1])+Math.abs(rgba[p*4+2]-rgba[q*4+2]);
  const nbs=p=>{const x=p%S,y=(p/S)|0,o=[];if(x>0)o.push(p-1);if(x<S-1)o.push(p+1);if(y>0)o.push(p-S);if(y<S-1)o.push(p+S);return o;};
  const inq=new Uint8Array(SS);
  for(let p=0;p<SS;p++)if(L[p]>0)for(const q of nbs(p))if(L[q]===0&&!inq[q]){inq[q]=1;Q[cost(p,q)].push(q);}
  for(let lev=0;lev<766;lev++){
    const q=Q[lev];
    for(let h=0;h<q.length;h++){
      const p=q[h];if(L[p]!==0)continue;
      let lab=0,mixed=false;
      for(const r of nbs(p)){const l=L[r];if(l>0){if(!lab)lab=l;else if(l!==lab)mixed=true;}}
      if(mixed){L[p]=-1;continue;}
      if(!lab)continue;
      L[p]=lab;
      for(const r of nbs(p))if(L[r]===0&&!inq[r]){inq[r]=1;Q[Math.max(lev,cost(p,r))].push(r);}
    }
  }
  return L;
}
function gradMag(gray){
  const o=new Float32Array(SS);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const x0=Math.max(0,x-1),x1=Math.min(S-1,x+1),y0=Math.max(0,y-1),y1=Math.min(S-1,y+1);
    const gx=gray[y*S+x1]-gray[y*S+x0],gy=gray[y1*S+x]-gray[y0*S+x];o[y*S+x]=Math.sqrt(gx*gx+gy*gy);
  }
  return o;
}

function paintRGBA(card,fn){const d=card.img.data;for(let i=0;i<SS;i++){const c=fn(i),q=i*4;d[q]=c[0];d[q+1]=c[1];d[q+2]=c[2];d[q+3]=255;}card.ctx.putImageData(card.img,0,0);}

function boundaries(L,rgba,col){
  const o=Uint8ClampedArray.from(rgba);

    const p=y*S+x,l=L[p];let b=l<0;

    <li><b>Mask:</b> Otsu separates the objects from the background. Touching coins fuse into one blob.</li>
    <li><b>Sure background:</b> grow the mask a little. Everything outside is definitely background.</li>
    <li><b>Distance transform:</b> every object pixel gets its distance to the nearest background pixel. Each coin centre becomes a peak, even when the coins touch.</li>
    <li><b>Sure foreground:</b> keep only the highest part of each peak. Touching coins now become separate islands.</li>
    <li><b>Markers:</b> number each island (one label per coin), the background gets its own label, and the unknown ring in between stays at 0.</li>
    <li><b>Watershed:</b> flood outwards from the markers. Water rises from every marker and a wall is built where two floods meet.</li></ol>`);

  root.append(el('<h2>Watershed: flood from markers</h2>'),el('<p class="explain">Picture the image as a landscape where edges are ridges. Water rises from marked spots, and where waters from different spots meet you build a wall. That wall is the boundary. The key is the marker: it tells the algorithm how many objects there are and roughly where. The six steps below are the standard OpenCV recipe for separating touching coins.</p>'),exp,ctl,cards,info,note);

    const cc=ccLabel(minMask,true);for(let i=0;i<SS;i++)if(cc.L[i])mk[i]=cc.L[i];nm=cc.n;

    C5.cap.textContent='One colour per coin; blue = background';C6.cap.textContent=`${r.count} coins found; red lines are the walls`;C7.cap.textContent=`${nm} regions: one per tiny dip in the image`;

function normImgD(f,hi){const o=new Uint8ClampedArray(SS);for(let i=0;i<SS;i++)o[i]=Math.round(Math.min(255,f[i]/hi*255));return o;}

  const t=new Float32Array(SS),o=new Float32Array(SS);

  const top=grid(260);top.append(A.el);
  const ctl=el(`<div class="controls"><span class="ctl-label">Components from</span>${seg('src',[['otsu','Otsu mask'],['ws','Watershed result']],'otsu')}<span class="ctl-label">A pixel is on the boundary if a neighbour in the</span>${seg('nb',[['8','8-neighbourhood'],['4','4-neighbourhood']],'8')}</div>`);
  const tw=el('<div class="scroll"></div>');
  const info=el('<div class="callout" aria-live="polite"><p></p></div>');
  root.append(el('<h2>Contours: area, perimeter and compactness</h2>'),el('<p class="explain">Take the binary mask and label each blob (connected component). For each one, <b>area</b> = number of pixels, <b>perimeter</b> = number of boundary pixels, and <b>compactness</b> = perimeter² ÷ (4π × area). A perfect circle scores 1, and the more stretched or ragged the shape, the larger the number. Click a blob in the picture, or a row in the table.</p>'),ctl,top,tw,info);
  bindSeg(root,'src',v=>{src=v;sel=0;render();});bindSeg(root,'nb',v=>{nb8=v==='8';render();});
  let cur=null;
  A.cv.addEventListener('click',e=>{const p=cellAt(A.cv,e,S);const l=cur&&cur.L[p.y*S+p.x];if(l>0){sel=l;draw();table();}});
  function render(){
    const rgba=rgbaOf(),gray=grayFrom(rgba);let L,n;
    if(src==='otsu'){const om=otsuMask(gray),cc=ccLabel(om.mask,true);L=cc.L;n=cc.n;}
    else{const p=wsPipeline(rgba,gray,0.5),Lw=new Int32Array(SS);let m=0;for(let i=0;i<SS;i++)if(p.ws[i]>1){Lw[i]=p.ws[i]-1;if(p.ws[i]-1>m)m=p.ws[i]-1;}L=Lw;n=m;}
    cur={L,n,st:compStats(L,n,nb8),rgba};
    if(sel>n)sel=0;draw();table();
  }
  function draw(){
    const {L,n,rgba}=cur,d=A.img.data;
    for(let y=0;y<S;y++)for(let x=0;x<S;x++){
      const p=y*S+x,l=L[p],q=p*4;
      if(!l){d[q]=14;d[q+1]=18;d[q+2]=26;d[q+3]=255;continue;}
      let edge=false;for(let j=-1;j<=1&&!edge;j++)for(let i=-1;i<=1;i++){if(!i&&!j)continue;if(!nb8&&i&&j)continue;const xx=x+i,yy=y+j;if(xx<0||yy<0||xx>=S||yy>=S||L[yy*S+xx]!==l){edge=true;break;}}
      const c=pal(l-1),on=sel===0||sel===l;
      if(edge){d[q]=255;d[q+1]=255;d[q+2]=255;}else{const f=on?0.55:0.22;d[q]=c[0]*f;d[q+1]=c[1]*f;d[q+2]=c[2]*f;}
      d[q+3]=255;
    }
    A.ctx.putImageData(A.img,0,0);
    A.cap.textContent=`${n} component${n===1?'':'s'}. White pixels are the boundary pixels that get counted as perimeter.`;
  }
  function table(){
    const {n,st}=cur;
    let h='<table class="t"><thead><tr><th>#</th><th class="num">Area (pixels)</th><th class="num">Perimeter (boundary pixels)</th><th class="num">Compactness</th><th class="num">Centre (x, y)</th></tr></thead><tbody>';
    for(let l=1;l<=n;l++){const s=st[l];h+=`<tr data-l="${l}" style="cursor:pointer;${sel===l?'background:color-mix(in srgb,var(--accent) 14%,var(--surface))':''}"><td><span class="swatch" style="background:${rgbCss(pal(l-1))}"></span>${l}</td><td class="num">${s.area}</td><td class="num">${s.per}</td><td class="num">${s.compact.toFixed(2)}</td><td class="num">${s.cx.toFixed(0)}, ${s.cy.toFixed(0)}</td></tr>`;}
    tw.innerHTML=h+'</tbody></table>';
    tw.querySelectorAll('tr[data-l]').forEach(r=>r.addEventListener('click',()=>{sel=+r.dataset.l===sel?0:+r.dataset.l;draw();table();}));
    const merged=st.slice(1).filter(s=>s.area>700);
    info.firstChild.innerHTML=src==='otsu'?(merged.length?`<b>Look at the biggest rows.</b> Several of these blobs have a very large area and a compactness well above 1: they are touching coins that the mask fused into one component, so you counted two or three coins as one. Switch to the watershed result to split them.`:'Each blob is one coin.'):`<b>After watershed</b> every coin is its own component, and the compactness values drop close to 1 because round coins are nearly circular.`;
  }
  return {update(){sel=0;render();},stop(){}};
}

/* ---------- 8 · Shape playground (compactness) ---------- */
function viewShape(root){
  const G=20;
  let grid_=new Uint8Array(G*G),nb8=true,drag=null;
  const cv=el(`<canvas width="400" height="400" role="img" aria-label="A 20 by 20 grid you can draw on" style="width:100%;max-width:400px;aspect-ratio:1;cursor:crosshair;touch-action:none;border:1px solid var(--line);border-radius:8px"></canvas>`);
  const ctl=el(`<div class="controls"><span class="ctl-label">Shape</span>${seg('sh',[['sq','Square'],['disk','Disk'],['rect','Thin rectangle'],['plus','Plus'],['star','Star'],['clear','Clear']],'disk')}<span class="ctl-label">Boundary test</span>${seg('nb',[['8','8-neighbourhood'],['4','4-neighbourhood']],'8')}</div>`);
  const tw=el('<div class="scroll"></div>');
  const note=el('<div class="callout"><p>Click and drag on the grid to draw or erase cells. A <b>disk</b> has the smallest perimeter for its area, so its compactness is the lowest (close to 1). A thin rectangle has the same kind of area but a long edge, so its compactness is large. Compactness tells you how round a shape is, and it does not depend on size.</p><p style="margin-top:8px"><b>Which definition?</b> Some books use circularity = 4π × area ÷ perimeter², which is the inverse (1 for a circle, smaller for other shapes). Use whichever your lecture does, but be consistent.</p></div>');
  const row=el('<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))"></div>');
  const left=el('<div class="card" style="gap:8px"></div>');left.append(cv);row.append(left);const right=el('<div class="card" style="gap:8px"></div>');right.append(tw);row.append(right);
  root.append(el('<h2>Draw a shape and measure it</h2>'),el('<p class="explain">Compactness is easier to feel than to read. Draw shapes on the grid and watch area, perimeter and compactness change.</p>'),ctl,row,note);
  function preset(n){
    const g=new Uint8Array(G*G);
    for(let y=0;y<G;y++)for(let x=0;x<G;x++){
      const dx=x-9.5,dy=y-9.5;let on=0;
      if(n==='sq')on=Math.abs(dx)<5.5&&Math.abs(dy)<5.5;
      else if(n==='disk')on=dx*dx+dy*dy<=7.2*7.2;
      else if(n==='rect')on=Math.abs(dx)<8.5&&Math.abs(dy)<1.6;
      else if(n==='plus')on=(Math.abs(dx)<2.2&&Math.abs(dy)<8.2)||(Math.abs(dy)<2.2&&Math.abs(dx)<8.2);
      else if(n==='star'){const a=Math.atan2(dy,dx),r=Math.hypot(dx,dy);on=r<=5.5+3.4*Math.abs(Math.cos(2.5*a));}
      g[y*G+x]=on?1:0;
    }
    return g;
  }
  bindSeg(root,'sh',v=>{grid_=preset(v);render();});bindSeg(root,'nb',v=>{nb8=v==='8';render();});
  function cell(e){const r=cv.getBoundingClientRect();const x=Math.max(0,Math.min(G-1,Math.floor((e.clientX-r.left)/r.width*G))),y=Math.max(0,Math.min(G-1,Math.floor((e.clientY-r.top)/r.height*G)));return y*G+x;}
  cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId);}catch(x){}const c=cell(e);drag=grid_[c]?0:1;grid_[c]=drag;render();});
  cv.addEventListener('pointermove',e=>{if(drag===null)return;const c=cell(e);if(grid_[c]!==drag){grid_[c]=drag;render();}});
  cv.addEventListener('pointerup',()=>{drag=null;});cv.addEventListener('pointercancel',()=>{drag=null;});
  function stats(){
    const L=new Int32Array(G*G),st=[];let n=0;const stack=[];
    for(let s=0;s<G*G;s++){if(!grid_[s]||L[s])continue;n++;L[s]=n;stack.length=0;stack.push(s);while(stack.length){const p=stack.pop(),x=p%G,y=(p/G)|0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){if(!i&&!j)continue;const xx=x+i,yy=y+j;if(xx<0||yy<0||xx>=G||yy>=G)continue;const q=yy*G+xx;if(grid_[q]&&!L[q]){L[q]=n;stack.push(q);}}}}
    const out=Array.from({length:n+1},()=>({a:0,p:0}));const edge=new Uint8Array(G*G);
    for(let y=0;y<G;y++)for(let x=0;x<G;x++){const l=L[y*G+x];if(!l)continue;out[l].a++;let e=false;for(let j=-1;j<=1&&!e;j++)for(let i=-1;i<=1;i++){if(!i&&!j)continue;if(!nb8&&i&&j)continue;const xx=x+i,yy=y+j;if(xx<0||yy<0||xx>=G||yy>=G||L[yy*G+xx]!==l){e=true;break;}}if(e){out[l].p++;edge[y*G+x]=1;}}
    return {L,n,out,edge};
  }
  function render(){
    const g=cv.getContext('2d'),W=cv.width,c=W/G,s=stats();
    g.clearRect(0,0,W,W);g.fillStyle=css('--surface');g.fillRect(0,0,W,W);
    for(let y=0;y<G;y++)for(let x=0;x<G;x++){
      if(grid_[y*G+x]){g.fillStyle=s.edge[y*G+x]?css('--out'):css('--in');g.fillRect(x*c,y*c,c,c);}
    }
    g.strokeStyle=css('--line');g.lineWidth=1;g.beginPath();for(let i=0;i<=G;i++){g.moveTo(i*c,0);g.lineTo(i*c,W);g.moveTo(0,i*c);g.lineTo(W,i*c);}g.stroke();
    let h='<table class="t"><thead><tr><th>Blob</th><th class="num">Area</th><th class="num">Perimeter</th><th class="num">Compactness</th></tr></thead><tbody>';
    for(let l=1;l<=s.n;l++){const a=s.out[l].a,p=s.out[l].p;h+=`<tr><td>${l}</td><td class="num">${a}</td><td class="num">${p}</td><td class="num">${(p*p/(4*Math.PI*a)).toFixed(2)}</td></tr>`;}
    tw.innerHTML=(s.n?h+'</tbody></table>':'<p class="note">Draw something on the grid.</p>')+'<p class="note" style="margin:8px 0 0">Orange cells are the boundary pixels that are counted. Compactness = perimeter² ÷ (4π × area).</p>';
  }
  grid_=preset('disk');
  return {update:render,stop(){drag=null;}};
}

initApp([{short:"Otsu",build:viewOtsu},{short:"K-means",build:viewKM},{short:"Mean shift",build:viewMS},{short:"Split and merge",build:viewSM},{short:"Watershed",build:viewWS},{short:"Compare",build:viewCmp},{short:"Contours",build:viewCont},{short:"Shape playground",build:viewShape}],'coins');
</script>
